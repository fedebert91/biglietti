<style>
  /* Layout: una colonna centrata, scheda unica con monogramma, dati e azioni. */
  :root {
    --bg: #F3F5F8;
    --card: #FFFFFF;
    --ink: #0E1A2B;
    --muted: #5B6779;
    --line: #DCE2EA;
    --accent: #1F4FD8;
    --accent-ink: #FFFFFF;
    --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0A1220; --card: #111C2E; --ink: #EEF2F8; --muted: #9AA7BA;
      --line: #223149; --accent: #7FA2FF; --accent-ink: #0A1220;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A1220; --card: #111C2E; --ink: #EEF2F8; --muted: #9AA7BA;
    --line: #223149; --accent: #7FA2FF; --accent-ink: #0A1220;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 var(--body);
    padding-inline: 16px; padding-block: 32px;
    min-height: 100vh;
    display: grid; place-items: start center;
  }
  main {
    width: 100%; max-width: 420px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 32px 24px 24px;
    display: flex; flex-direction: column; gap: 24px;
  }
  .head { display: flex; flex-direction: column; gap: 16px; }
  .mono {
    width: 64px; height: 64px; border-radius: 16px;
    background: var(--ink); color: var(--card);
    display: grid; place-items: center;
    font: 700 22px/1 var(--display); letter-spacing: .02em;
  }
  h1 {
    margin: 0; font: 700 30px/1.1 var(--display);
    letter-spacing: -.01em; text-wrap: balance;
  }
  .role { margin: 0; color: var(--muted); font-weight: 500; }
  .org {
    margin: 0; font: 700 13px/1 var(--display);
    letter-spacing: .22em; text-transform: uppercase;
  }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 52px; padding: 0 20px; border-radius: 14px;
    font: 600 16px/1 var(--body); text-decoration: none;
    border: 1px solid var(--line); color: var(--ink); background: transparent;
  }
  .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn svg { width: 20px; height: 20px; flex: none; }
  dl { margin: 0; display: grid; gap: 14px; }
  dl div { display: grid; gap: 2px; min-width: 0; }
  dt { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  dd { margin: 0; overflow-wrap: anywhere; }
  dd a { color: inherit; text-underline-offset: 3px; }
  .qr {
    border-top: 1px solid var(--line); padding-top: 20px;
    display: flex; align-items: center; gap: 16px;
  }
  .qr img { width: 112px; height: 112px; border-radius: 8px; flex: none; background: #fff; }
  .qr p { margin: 0; color: var(--muted); font-size: 14px; }
  @media (hover: none) { .qr { display: none; } }
</style>
</head>
