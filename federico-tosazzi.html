<style>
  /* Colori e font ripresi dal sito odex.it. Fondo scuro come il footer del sito. */
  :root {
    --orange: #FF7F00;
    --blue: #04A1FF;
    --bg: #09090b;
    --surface: #111113;
    --surface-2: #1a1a1e;
    --line: #2a2a30;
    --text: #e4e4e7;
    --muted: #9a9aa5;
    --font: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 400 16px/1.5 var(--font);
    -webkit-font-smoothing: antialiased;
    padding-inline: 16px; padding-block: 24px;
    min-height: 100vh;
    display: grid; place-items: start center;
  }
  .card {
    width: 100%; max-width: 420px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 24px;
    overflow: hidden;
  }
  .top {
    position: relative;
    padding: 28px 24px 28px;
    background:
      radial-gradient(120% 90% at 0% 0%, rgba(4,161,255,.22), transparent 60%),
      radial-gradient(90% 80% at 100% 100%, rgba(255,127,0,.20), transparent 62%),
      var(--bg);
    border-bottom: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 56px;
  }
  .logo { display: block; height: 28px; width: auto; max-width: 160px; margin-left: -29px; }
  .wordmark { font-weight: 800; font-size: 24px; letter-spacing: .18em; color: #fff; }
  .id { display: flex; flex-direction: column; gap: 8px; }
  h1 {
    margin: 0; font: 700 34px/1.08 var(--font);
    letter-spacing: -.02em; color: #fff; text-wrap: balance;
  }
  .role {
    margin: 0; font-weight: 600; font-size: 13px;
    letter-spacing: .12em; text-transform: uppercase; color: var(--blue);
  }
  .body { padding: 24px; display: flex; flex-direction: column; gap: 24px; }

  .actions { display: grid; gap: 10px; }
  .btn {
    position: relative; overflow: hidden; isolation: isolate;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 54px; padding: 0 20px; border-radius: 14px;
    font: 700 16px/1 var(--font); text-decoration: none;
    transition: transform .12s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn:focus-visible, .row:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
  .btn.primary { background: var(--orange); color: #fff; }
  .btn.primary::after {
    content: ""; position: absolute; inset: 0; z-index: -1;
    background: rgba(255,255,255,.16); transform: translateX(-101%);
    transition: transform .4s cubic-bezier(.16,1,.3,1);
  }
  .btn.primary:hover::after, .btn.primary:focus-visible::after { transform: translateX(0); }
  .btn.primary .arrow { transition: transform .25s ease; }
  .btn.primary:hover .arrow { transform: translateX(4px); }
  .btn.ghost { border: 1px solid var(--line); color: var(--text); background: transparent; font-weight: 600; }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn svg { width: 20px; height: 20px; flex: none; }

  .rows { display: flex; flex-direction: column; }
  .row {
    display: flex; align-items: center; gap: 14px; min-width: 0;
    padding: 14px 0; border-top: 1px solid var(--line);
    color: inherit; text-decoration: none;
  }
  .row:first-child { border-top: 0; padding-top: 0; }
  .ico {
    width: 40px; height: 40px; border-radius: 12px; flex: none;
    background: var(--surface-2); border: 1px solid var(--line);
    display: grid; place-items: center; color: var(--blue);
  }
  .ico svg { width: 18px; height: 18px; }
  .txt { display: flex; flex-direction: column; min-width: 0; }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .val { font-weight: 500; overflow-wrap: anywhere; }
  a.row:hover .val { color: #fff; }

  .qr {
    display: flex; align-items: center; gap: 16px;
    padding: 16px; border-radius: 16px; background: var(--surface-2); border: 1px solid var(--line);
  }
  .qr img { width: 104px; height: 104px; border-radius: 10px; flex: none; background: #fff; padding: 6px; }
  .qr p { margin: 0; color: var(--muted); font-size: 14px; }
  @media (hover: none) { .qr { display: none; } }

  .foot {
    padding: 16px 24px; border-top: 1px solid var(--line);
    font-size: 11px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase;
    color: #6b6b75; text-align: center;
  }
</style>
</head>
